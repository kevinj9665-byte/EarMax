# The release gate: every push and pull request runs the tests,
# lint and both release builds, then tools/release/check_release.py on the APKs and on the bundle
# that is uploaded to Google Play. A release is made
# only from a commit whose gate is green; on a v* tag the release-only checks run too (version
# matches the tag, What's New and CHANGELOG written). Signing stays on a local machine
# (docs/release-signing.md), so the APKs built here are unsigned and never published from CI; the
# certificate checks run there, on the signed asset that is published.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Gradle heaps for the runner
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx4g" >> ~/.gradle/gradle.properties
          chmod +x gradlew

      - name: Unit tests (protocol, dsp)
        run: ./gradlew :protocol:test :dsp:test --console=plain

      - name: Unit tests (app)
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Debug build
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Release build (unsigned)
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Keep reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
